<div class="admin-login-page">

  <div class="admin-login-card">

    <a routerLink="/" class="admin-logo">
      Skill<span>Kamao</span>
    </a>

    <div class="admin-icon">
      🛡️
    </div>

    <div class="heading">

      <span>ADMIN PANEL</span>

      <h1>Admin Login</h1>

      <p>
        Login to manage courses, students and certificates.
      </p>

    </div>


    <form
      #adminForm="ngForm"
      (ngSubmit)="loginAdmin()">

      <div class="form-group">

        <label>
          Admin Email
        </label>

        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="admin@skillkamao.com"
          autocomplete="username">

      </div>


      <div class="form-group">

        <label>
          Password
        </label>

        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter admin password"
          autocomplete="current-password">

      </div>


      @if (errorMessage) {

        <div class="message error">
          {{ errorMessage }}
        </div>

      }


      @if (successMessage) {

        <div class="message success">
          {{ successMessage }}
        </div>

      }


      <button
        type="submit"
        class="login-button">

        Login to Admin Panel →

      </button>

    </form>


    <a
      routerLink="/"
      class="back-home">

      ← Back to SkillKamao

    </a>

  </div>

</div>
